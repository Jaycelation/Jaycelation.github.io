  <text x="219" y="104" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="35" font-weight="400" fill="#292929">Cool</text>
  <text x="383" y="97" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" fill="#777777">...</text>

  <rect x="15" y="141" width="410" height="56" rx="13" fill="#ffffff" stroke="#ffffff" filter="url(#softShadow)"/>
  <text x="36" y="175" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#000000">dashing-moon-37</text>
  <text x="190" y="175" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#9a9a9a">.webhook.cool</text>
  <rect x="361" y="163" width="10" height="10" fill="none" stroke="#777" stroke-width="1.4"/>
  <path d="M366 160h10v10" fill="none" stroke="#777" stroke-width="1.4"/>
  <path d="M388 165l6 6 6-6" fill="none" stroke="#111" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="15" y="228" width="410" height="49" rx="8" fill="#ffffff"/>
  <text x="36" y="259" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="500" fill="#000000">GET</text>
  <text x="224" y="258" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" fill="#888888">22 May 15:14:08.566</text>
  <path d="M386 248h15" stroke="#9a9a9a" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M390 249v13c0 2 2 4 4 4h2c2 0 4-2 4-4v-13" fill="none" stroke="#9a9a9a" stroke-width="1.5"/>
  <path d="M391 244h8" stroke="#9a9a9a" stroke-width="1.5" stroke-linecap="round"/>

