<svg xmlns="http://www.w3.org/2000/svg" width="1462" height="627" viewBox="0 0 1462 627" role="img" aria-labelledby="title desc">
  <title id="title">WebhookCool request showing the injected script fetch</title>
  <desc id="desc">A WebhookCool-style request view showing a GET request from the Intigriti challenge page to the attacker-controlled script endpoint.</desc>
  <defs>
    <linearGradient id="sidebar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f1ed"/>
      <stop offset="1" stop-color="#e8f6f2"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#c7c7c7" flood-opacity=".22"/>
    </filter>
  </defs>

  <rect width="1462" height="627" fill="#ffffff"/>
  <rect x="0" y="0" width="445" height="627" fill="url(#sidebar)"/>
  <rect x="445" y="0" width="1017" height="627" fill="#fbfbfb"/>

  <circle cx="35" cy="32" r="7" fill="#f8f8f8" stroke="#9e9e9e" stroke-width="1.5"/>
  <circle cx="62" cy="32" r="7" fill="#f8f8f8" stroke="#9e9e9e" stroke-width="1.5"/>
  <circle cx="89" cy="32" r="7" fill="#f8f8f8" stroke="#9e9e9e" stroke-width="1.5"/>

  <circle cx="43" cy="91" r="19" fill="#ffe35b"/>
  <circle cx="36" cy="87" r="7" fill="#55c0ff"/>
  <circle cx="50" cy="87" r="7" fill="#55c0ff"/>
